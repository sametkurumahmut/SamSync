# Builds SamSync for Windows, macOS and Linux when a version tag is pushed, uploads the installers
# plus the latest*.yml update feeds to one draft GitHub Release, and publishes it once every platform
# built and passed its tests; installed apps then update from it. A failed build leaves the draft.
#   1. bump "version" in app/package.json   2. git tag v2.1.0   3. git push origin v2.1.0
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build and upload to the draft release
        run: node scripts/dist.mjs --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # no signing certificates in CI: macOS builds are unsigned (no auto-update there)
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # the packaged app opens once and photographs its window: a blank window (a broken bundle) fails the
      # build, so the draft is never published
      - name: Smoke test the packaged app (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq xvfb > /dev/null
          xvfb-run -a --server-args="-screen 0 1400x900x24" node scripts/smoke.mjs
      - name: Smoke test the packaged app
        if: runner.os != 'Linux'
        run: node scripts/smoke.mjs
      - name: Keep the smoke screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: app/release/*/smoke-*.png
          if-no-files-found: ignore

  publish:
    # only when all three builds above succeeded
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      # one file with the SHA-256 of every download, so a copy from a mirror or a USB stick can be checked:
      #   Windows: Get-FileHash SamSync-Setup-x.y.z.exe   macOS/Linux: shasum -a 256 -c SHA256SUMS.txt
      - name: Checksums
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir assets && cd assets
          gh release download "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --pattern '*.exe' --pattern '*.zip' --pattern '*.dmg' --pattern '*.AppImage'
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release upload "$GITHUB_REF_NAME" SHA256SUMS.txt --repo "$GITHUB_REPOSITORY" --clobber
      # the notes are this version's CHANGELOG section: the update window in the app shows them (without notes
      # GitHub would show the tagged commit's message)
      - uses: actions/checkout@v5
        with:
          path: src
      - name: Release notes from the changelog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node src/app/scripts/release-notes.mjs "$GITHUB_REF_NAME" notes.md
          cat notes.md
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --notes-file notes.md
      - name: Publish the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest
