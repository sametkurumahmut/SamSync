appId: com.sametkurumahmut.samsync
productName: SamSync
copyright: Copyright © 2026 Samet Kurumahmut

npmRebuild: false

directories:
  output: release/${version}
  buildResources: resources

files:
  - out/**
  - resources/**
  - package.json
  - '!out/web/**'
  - '!**/*.map'
  # ssh2 falls back to pure JavaScript without these optional native add-ons
  - '!node_modules/cpu-features{,/**}'
  - '!node_modules/ssh2/lib/protocol/crypto/build{,/**}'

win:
  icon: resources/icon.ico
  executableName: SamSync
  # SamSyncSend.exe next to SamSync.exe: what the Explorer menu starts (built by scripts/build-launcher.mjs)
  extraFiles:
    - from: out/launcher
      to: .
      filter: ['*.exe']
  target:
    - target: nsis
      arch: [x64]
    - target: portable
      arch: [x64]
    # the unpacked app in a zip: no extraction on every start, data in SamSync-data next to SamSync.exe
    - target: zip
      arch: [x64]
  artifactName: ${productName}-${version}-win.${ext}

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: SamSync
  artifactName: ${productName}-Setup-${version}.${ext}
  deleteAppDataOnUninstall: false
  # the GPL-3.0 text, shown on the installer's first page
  license: ../LICENSE

portable:
  artifactName: ${productName}-${version}-portable.${ext}

mac:
  icon: resources/icon.png
  category: public.app-category.developer-tools
  target: [dmg, zip]
  artifactName: ${productName}-${version}-${arch}.${ext}

linux:
  icon: resources/icon.png
  category: Development
  target: [AppImage]
  artifactName: ${productName}-${version}-${arch}.${ext}

# a double-click on a pack file opens SamSync with it on the Send page (Windows registers it at install, macOS via the bundle)
fileAssociations:
  - ext: samsync-pack
    name: SamSync Pack
    description: SamSync package
    role: Viewer

# owner/repo are set by scripts/dist.mjs from the git remote (or GITHUB_REPOSITORY in CI) and end up in app-update.yml
publish:
  - provider: github
    owner: ${env.SAMSYNC_GH_OWNER}
    repo: ${env.SAMSYNC_GH_REPO}

# the changelog ships with the app: the "what's new" card after an update reads this version's section
extraResources:
  # the licence travels with every package (GPL-3.0 asks for its text alongside the program)
  - from: ../LICENSE
    to: LICENSE
  - from: CHANGELOG.md
    to: CHANGELOG.md
  # the help bot's knowledge (offline search in the window, and the context of the optional Claude answers)
  - from: README.md
    to: README.md
  - from: README.tr.md
    to: README.tr.md
